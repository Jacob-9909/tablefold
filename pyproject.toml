[project]
name = "tablefold"
version = "0.1.0"
description = "Fold a wide physical schema into a handful of wide logical models an LLM can read in one shot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=25.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
tablefold = "tablefold.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tablefold"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
